name: Claude PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      github.event_name == 'pull_request' || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Resolve branch name for PR info
      - name: Resolve branch and PR number
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BRANCH="$HEAD_REF"
            PR_NUMBER="$ISSUE_NUMBER"
          else
            # @claude 코멘트 트리거: PR 번호로 head 브랜치를 조회한다.
            PR_NUMBER="$ISSUE_NUMBER"
            BRANCH="$(gh pr view "$ISSUE_NUMBER" --repo "$REPO" --json headRefName -q .headRefName)"
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "브랜치명: $BRANCH (PR #$PR_NUMBER) - 모든 브랜치에서 리뷰를 진행합니다."

      - name: Claude PR Review
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: claude-sonnet-5
          allowed_tools: "Bash,Read"
          direct_prompt: |
            다음 pull request를 리뷰하세요. 리뷰 코멘트는 반드시 한국어로 작성하세요 (코드 식별자, 함수명 등 고유명사 제외).

            1. `gh pr view ${{ steps.pr_info.outputs.pr_number }}` 명령으로 PR 정보를 확인하세요.
            2. `gh pr diff ${{ steps.pr_info.outputs.pr_number }}` 명령으로 전체 변경 사항을 확인하세요.
            3. 다음 항목을 중심으로 변경 사항을 리뷰하세요:
               - **버그 및 오류**: 런타임 에러, 엣지 케이스, 잘못된 로직
               - **타입 안전성**: TypeScript 타입 오류나 any 남용
               - **성능**: 불필요한 리렌더링, 비효율적인 API 호출, 메모리 누수
               - **보안**: XSS, SQL 인젝션 등 OWASP Top 10 취약점
               - **코드 품질**: 중복 코드, 복잡도, 네이밍 컨벤션
            4. `gh pr comment` 명령으로 아래 심각도 형식에 맞춰 리뷰를 PR 코멘트로 등록하세요:
               - 🔴 **Critical**: 반드시 수정해야 하는 문제
               - 🟡 **Warning**: 수정을 권장하는 문제
               - 🟢 **Suggestion**: 선택적 개선 사항
             모든 지적사항에는 파일 경로와 라인 번호를 구체적으로 명시하세요. 마지막 줄에 승인 여부를 한국어로 명시하세요: "승인(APPROVE)", "수정 요청(REQUEST CHANGES)", "논의 필요(NEEDS DISCUSSION)" 중 하나.

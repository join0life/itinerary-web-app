<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Motion</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:74px;border-radius:10px;overflow:hidden;border:1px solid var(--border-subtle)}.sw i{display:block;height:56px}.sw b{display:block;font-size:11px;font-weight:600;padding:6px 8px 1px;color:var(--text-primary)}.sw s{display:block;font-size:10px;text-decoration:none;padding:0 8px 6px;color:var(--text-muted);font-variant-numeric:tabular-nums}</style></head><body><style>.b{height:44px;border:0;border-radius:var(--radius-md);color:#fff;background:var(--action-primary);font:600 15px/1 var(--font-sans);padding:0 18px;transition:var(--transition-control);cursor:pointer}.b:hover{background:var(--action-primary-hover)}.b:active{transform:scale(.98);background:var(--action-primary-pressed)}</style>
<div style="display:flex;gap:12px;align-items:center"><button class="b">기본</button><button class="b" style="background:var(--action-primary-hover)">hover</button><button class="b" style="background:var(--action-primary-pressed);transform:scale(.98)">pressed</button><button class="b" style="background:var(--action-disabled);color:var(--action-disabled-foreground)">disabled</button><span style="font-size:11px;color:var(--text-muted)">fade/색상 전환만, 바운스 없음</span></div></body></html>

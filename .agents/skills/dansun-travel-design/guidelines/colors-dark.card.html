<!-- @dsCard group="Colors" viewport="700x150" name="Dark mode pairs" subtitle="Dark is a first-class theme: every token has a dark value." -->
<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Dark</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:74px;border-radius:10px;overflow:hidden;border:1px solid var(--border-subtle)}.sw i{display:block;height:56px}.sw b{display:block;font-size:11px;font-weight:600;padding:6px 8px 1px;color:var(--text-primary)}.sw s{display:block;font-size:10px;text-decoration:none;padding:0 8px 6px;color:var(--text-muted);font-variant-numeric:tabular-nums}</style></head><body><div class="dark" style="background:var(--surface-page);padding:12px;border-radius:12px"><div class="row"><div class="sw"><i style="background:var(--color-neutral-0)"></i><b>surface</b><s>#121212</s></div><div class="sw"><i style="background:var(--color-neutral-100)"></i><b>muted</b><s>#1F1F1F</s></div><div class="sw"><i style="background:var(--color-neutral-200)"></i><b>border</b><s>#2A2A2A</s></div><div class="sw"><i style="background:var(--color-neutral-900)"></i><b>ink</b><s>#F5F5F5</s></div><div class="sw"><i style="background:var(--color-primary-500)"></i><b>primary-500</b><s>#FF7A56</s></div><div class="sw"><i style="background:var(--color-secondary-500)"></i><b>secondary-500</b><s>#3ECB9B</s></div></div></div></body></html>

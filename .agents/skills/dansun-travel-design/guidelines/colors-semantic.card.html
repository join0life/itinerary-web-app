<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Semantic</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:74px;border-radius:10px;overflow:hidden;border:1px solid var(--border-subtle)}.sw i{display:block;height:56px}.sw b{display:block;font-size:11px;font-weight:600;padding:6px 8px 1px;color:var(--text-primary)}.sw s{display:block;font-size:10px;text-decoration:none;padding:0 8px 6px;color:var(--text-muted);font-variant-numeric:tabular-nums}</style></head><body><div class="row"><div class="sw"><i style="background:var(--color-success)"></i><b>success</b><s>#2FBF8F</s></div><div class="sw"><i style="background:var(--color-warning)"></i><b>warning</b><s>#F5A623</s></div><div class="sw"><i style="background:var(--color-error)"></i><b>error</b><s>#E5484D</s></div><div class="sw"><i style="background:var(--color-info)"></i><b>info</b><s>#4C8DFF</s></div></div></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Focus</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:74px;border-radius:10px;overflow:hidden;border:1px solid var(--border-subtle)}.sw i{display:block;height:56px}.sw b{display:block;font-size:11px;font-weight:600;padding:6px 8px 1px;color:var(--text-primary)}.sw s{display:block;font-size:10px;text-decoration:none;padding:0 8px 6px;color:var(--text-muted);font-variant-numeric:tabular-nums}</style></head><body><div style="display:flex;gap:20px;align-items:center">
